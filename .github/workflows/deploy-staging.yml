name: Deploy Staging
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag to deploy
        required: true
        default: latest
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: af-south-1
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
      - name: Deploy to ECS
        run: echo "Deploy image ${{ inputs.image_tag }} using the approved infrastructure pipeline"
